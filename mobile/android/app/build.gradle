import groovy.json.JsonSlurper
plugins { id 'com.android.application' }
def appConfig = new JsonSlurper().parse(rootProject.file('../app.config.json'))
def website = new URI(appConfig.websiteUrl)
if (website.scheme != 'https' || !website.host || website.userInfo || website.query || website.fragment) throw new GradleException('websiteUrl must be a public HTTPS URL without credentials, query or fragment')
android {
 namespace = 'com.digigraptek.membership'
 compileSdk { version = release(37) { minorApiLevel = 0 } }
 defaultConfig {
  applicationId = appConfig.appId
  minSdk = 26
  targetSdk = 37
  versionCode = appConfig.versionCode
  versionName = appConfig.versionName
  buildConfigField 'String', 'WEBSITE_URL', groovy.json.JsonOutput.toJson(appConfig.websiteUrl)
  resValue 'string', 'app_name', appConfig.appName
 }
 buildFeatures { buildConfig = true; resValues = true }
 compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled = false } }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
